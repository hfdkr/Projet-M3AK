<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
    --color-brand:        #0B6B45;
    --color-brand-dark:   #084F34;
    --color-brand-soft:   #E9F3EE;
    --color-brand-line:   #CFE3D8;
    --color-danger:       #E1362C;
    --color-danger-soft:  #FDECEA;
    --color-ink:          #0F1A15;
    --color-muted:        #6B7A73;
    --color-canvas:       #F6F7F5;
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  }
</style>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Halo respirant autour du bouton SOS (s'arrête pendant l'appui) */
        .sos-halo::before {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 9999px;
            background: rgba(225, 54, 44, .14);
            animation: halo 2.4s ease-out infinite;
        }

        .sos-halo.is-holding::before {
            animation: none;
            opacity: 0;
        }

        @keyframes halo {

            0%,
            100% {
                transform: scale(.92);
                opacity: .55;
            }

            50% {
                transform: scale(1.06);
                opacity: 0;
            }
        }

        #sosBtn {
            transition: transform .18s ease, box-shadow .18s ease;
        }

        #sosBtn.is-holding {
            transform: scale(.94);
        }

        .fade-in {
            animation: fadeIn .25s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
