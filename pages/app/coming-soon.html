<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon — M3ak Morocco</title>
    <script src="/pages/js/session.js"></script>
    <script src="/pages/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @theme {
            --color-brand: #0B6B45;
            --color-brand-dark: #084F34;
            --color-brand-soft: #E9F3EE;
            --color-brand-line: #CFE3D8;
            --color-ink: #0F1A15;
            --color-muted: #6B7A73;
            --color-canvas: #F6F7F5;

            --color-night-900: #0A0F0D;
            --color-night-800: #0F1512;
            --color-night-700: #151C18;
            --color-night-600: #232C27;
            --color-mist-300: #7C8981;
            --color-mist-100: #E7ECE9;
            --color-accent-400: #2ED573;

            --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        }

        body {
            @apply bg-canvas dark:bg-night-900 text-ink dark:text-mist-100 font-sans transition-colors duration-200;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col" data-require-auth>

    <header class="border-b border-black/5 dark:border-white/10 bg-white dark:bg-night-800">
        <div class="mx-auto flex h-16 max-w-[1200px] items-center gap-4 px-6">
            <a href="/pages/app/overview.html" class="text-xl font-extrabold tracking-tight text-brand dark:text-accent-400">M3ak Morocco</a>

            <button type="button"
                class="relative ml-auto flex h-8 w-14 cursor-pointer items-center rounded-full bg-slate-200 p-1 transition-colors duration-300 dark:bg-slate-700"
                data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
                <span class="flex h-6 w-6 items-center justify-center rounded-full bg-white shadow-md transition-transform duration-300 dark:translate-x-6 dark:bg-slate-900">
                    <img src="/assets/settings/sun.png" alt="Light mode" class="h-4 w-4 object-contain transition-all duration-300 dark:hidden">
                    <img src="/assets/settings/moon.png" alt="Dark mode" class="absolute hidden h-4 w-4 object-contain transition-all duration-300 dark:block">
                </span>
            </button>
        </div>
    </header>

    <main class="mx-auto flex max-w-[560px] flex-1 flex-col items-center justify-center px-6 py-20 text-center">
        <span class="grid size-16 place-items-center rounded-2xl bg-brand-soft dark:bg-accent-400/15 text-brand dark:text-accent-400">
            <img src="/assets/coming-soon/SVG.png" alt="time-icon">

        </span>

        <h1 id="feature-title" class="mt-6 text-2xl font-extrabold tracking-tight">This service is coming soon</h1>
        <p id="feature-desc" class="mt-3 text-sm leading-relaxed text-muted dark:text-mist-300">
            We're building this part of the M3ak citizen portal. It isn't available yet, but the rest of the
            platform is ready for you to explore.
        </p>

        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
            <a href="/pages/app/overview.html"
                class="rounded-full bg-brand px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark">
                Back to My Space
            </a>
            <button type="button" onclick="history.back()"
                class="rounded-full border border-black/10 dark:border-white/15 px-6 py-3 text-sm font-semibold text-ink dark:text-mist-100 transition hover:bg-white dark:hover:bg-night-800">
                Go Back
            </button>
        </div>
    </main>

    <footer class="border-t border-black/5 dark:border-white/10 bg-white dark:bg-night-800 py-6">
        <p class="text-center text-xs text-muted dark:text-mist-300">© 2026 Kingdom of Morocco · M3ak Super App.</p>
    </footer>

    <script>
        var params = new URLSearchParams(window.location.search);
        var feature = params.get("feature");
        if (feature) {
            document.getElementById("feature-title").textContent = feature + " is coming soon";
            document.getElementById("feature-desc").textContent =
                "We're building the " + feature + " section of the M3ak citizen portal. It isn't available yet, but the rest of the platform is ready for you to explore.";
            document.title = feature + " — Coming Soon — M3ak Morocco";
        }
    </script>
</body>

</html>
