<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un nouveau mot de passe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/pages/js/new-password.js" defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- SHELL : carte simple en mobile, panneau 2 colonnes à partir de md -->
    <div class="w-full max-w-sm md:max-w-4xl lg:max-w-6xl bg-white rounded-2xl shadow-sm
                border border-gray-100 overflow-hidden md:flex md:flex-col">

        <!-- ============ TOP BAR — MOBILE ============ -->
        <section class="flex items-center justify-between px-5 py-4 md:hidden">
            <a href="/pages/auth/login.html"
                class="flex items-center gap-2 text-emerald-800 text-sm font-medium hover:text-emerald-900">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Log in
            </a>
            <span
                class="flex items-center gap-1 bg-emerald-50 text-emerald-800 text-xs font-medium px-3 py-1.5 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
                </svg>
                Secured
            </span>
        </section>

        <!-- ============ HEADER — TABLETTE / DESKTOP ============ -->
        <header class="hidden md:flex items-center justify-between bg-[#F8FAFC] border-b border-gray-100
                       px-8 py-4 lg:px-10 lg:py-5">
            <a href="/index.html" class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-[10px] bg-[#0B6B45] flex items-center justify-center">
                    <!-- logo img -->
                    <img src="" alt="">
                </span>
                <span class="text-[19px] font-bold text-[#0B6B45] tracking-tight">M3ak</span>
            </a>

            <nav class="flex items-center gap-7 lg:gap-9 text-sm text-gray-600">
                <a href="#" class="hover:text-[#0B6B45]">Assistance</a>
                <a href="#" class="hover:text-[#0B6B45]">Français</a>
            </nav>
        </header>

        <hr class="border-gray-100 md:hidden" />

        <!-- ============ CORPS — 2 COLONNES À PARTIR DE md ============ -->
        <section class="md:grid md:grid-cols-2 md:items-stretch">

            <!-- ---------- COLONNE GAUCHE (md+ uniquement) ---------- -->
            <aside class="hidden md:flex md:flex-col md:justify-between relative overflow-hidden
                          bg-[#EEF2FB] px-8 py-10 lg:px-12 lg:py-14 md:border-r md:border-gray-100">

                <!-- halo décoratif -->
                <div class="pointer-events-none absolute -bottom-24 -left-20 w-72 h-72 rounded-full
                            bg-[#DCE5F7] blur-3xl opacity-70"></div>

                <!-- Aperçu carte d'identité numérique -->
                <div class="relative">
                    <div class="relative w-full max-w-[330px] bg-white rounded-2xl shadow-sm lg:p-6">
                        <div class="rounded-xl bg-gradient-to-br from-[#0B6B45] to-[#0E8A58] p-4 lg:p-5">
                            <div class="">
                                <img src="/assets/image-new-password/Icon(4).png" alt="">
                            </div>
                            <div class="flex items-center justify-between"></div>
                            <div class="mt-4 flex items-center gap-3">
                                <div
                                    class="w-11 h-12 rounded-md bg-white/95 shrink-0 flex items-end justify-center overflow-hidden">
                                    <img src="/assets/image-new-password/header-img.png" alt="">

                                </div>
                                <div class="flex-1 space-y-2">
                                    <div class="h-[12px] w-[128px]  rounded-full bg-white/30"></div>
                                    <div class="h-[12px] w-[80px] rounded-full bg-white/20"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- badge flottant "Status / Secured" -->
                    <div class="absolute right-[-14px] lg:right-[-24px] top-1/2 -translate-y-1/2
                                bg-white rounded-xl shadow-lg px-3 py-2 flex items-center gap-2.5">
                        <span class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center shrink-0">
                            
                        </span>
                        <span class="leading-tight">
                            <span class="block text-[10px] text-gray-400">Status</span>
                            <span class="block text-[12px] font-bold text-[#0B6B45]">Secured</span>
                        </span>
                    </div>
                </div>

                <!-- Titre bas de colonne -->
                <div class="relative mt-14 lg:mt-20">
                    <h2 class="font-bold text-gray-900 tracking-tight text-[32px] leading-[38px]
                               lg:text-[40px] lg:leading-[46px]">
                        Set New Password
                    </h2>
                    <p class="mt-3 text-sm lg:text-[15px] leading-relaxed text-gray-500 max-w-[330px]">
                        Create a strong, secure password to protect your digital identity
                        and access government services.
                    </p>
                </div>
            </aside>
        </section>
    </div>
</body>

</html>
