<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M3ak Morocco | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #F7FFF8;
        }

        .glass {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, .82);
        }

        .shadow-card {
            box-shadow:
                0 10px 35px rgba(0, 0, 0, .08);
        }

        .input {
            @apply w-full bg-[#F4F7F5] rounded-xl h-12 px-11 outline-none border border-transparent transition-all;
        }

        .input:focus {
            border-color: #0B6B45;
            box-shadow: 0 0 0 3px rgba(11, 107, 69, .15);
        }

        .social {
            transition: .25s;
        }

        .social:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
        }

        .btn {
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .bg-gradient {
            background:
                radial-gradient(circle at top, #DBF7E6, transparent 45%),
                radial-gradient(circle at bottom, #CEF8D7, transparent 45%),
                #F7FFF8;
        }

        .fade {
            animation: fade .7s;
        }

        @keyframes fade {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: none;
            }

        }
    </style>

</head>

<body class="bg-gradient relative min-h-screen">
    <div class="hidden md:block md:absolute md:top-[390px] md:right-6">
        <img src="/assets/image-login/Visual Flourish.png" alt="Visual Flourish">
    </div>
    <!-- TOP -->
    <header>
        <div class="lg:hidden px-6 pt-6">

            <a href="#" class="flex items-center gap-2 text-[#0B6B45] font-medium">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />

                </svg>

                Back to Onboarding

            </a>

        </div>
    </header>
    <!-- CONTENT -->
    <main class="mt-[9px] md:mt-[93px]">
        <section>
            <div class="flex flex-col items-center justify-center text-center">
                <div class="w-[64px] py-[14px] bg-[#127147] items-center text-center flex justify-center rounded-[16px]">
                    <img src="/assets/image-login/logo.png" alt="logo-page">
                </div>

                <h1 class="mt-4 text-4xl font-bold text-[#0B6B45]">
                    M3ak Morocco
                </h1>

                <p class="mt-2 text-gray-500">
                    Access your unified citizen portal
                </p>
            </div>
        </section>
        <section class="flex-1 flex items-center justify-center mt-[30px] pb-[96px]">
            <div class="w-full max-w-7xl px-6">
                <div class="flex justify-center gap-16 items-center">
                    <!-- LEFT -->
                    <div class="fade items-center ">
                        <!-- CARD -->
                        <div class="glass shadow-card rounded-3xl w-full max-w-md p-8">
                            <form class="space-y-6">

                                <!-- EMAIL -->

                                <div>

                                    <label class="text-sm font-medium text-gray-700">

                                        National ID or Email

                                    </label>

                                    <div class="relative mt-2">

                                        <div class="absolute left-4 top-1/2 -translate-y-1/2">
                                            <img src="/assets/image-login/user-icon.png" alt="user-icon">
                                        </div>

                                        <input type="text" placeholder="e.g. AB123456"
                                            class="w-full h-12 rounded-xl bg-[#F4F7F5] pl-12 pr-4 focus:ring-4 focus:ring-green-100 outline-none">

                                    </div>

                                </div>

                                <!-- PASSWORD -->

                                <div>

                                    <div class="flex justify-between">

                                        <label class="text-sm font-medium text-gray-700">
                                            Password
                                        </label>

                                        <a href="#" class="text-sm text-blue-600">
                                            Forgot?
                                        </a>

                                    </div>

                                    <div class="relative mt-2">

                                        <div class="absolute left-4 top-1/2 -translate-y-1/2">
                                            <img src="/assets/image-login/securety-icon.png" alt="secure icon">
                                        </div>

                                        <input id="password" type="password" placeholder="••••••••"
                                            class="w-full h-12 rounded-xl bg-[#F4F7F5] pl-12 pr-12 outline-none focus:ring-4 focus:ring-green-100">

                                        <button type="button" onclick="togglePassword()"
                                            class="absolute right-4 top-1/2 -translate-y-1/2">
                                            <img src="/assets/image-login/show-icon.png" alt="show icon">
                                        </button>
                                    </div>
                                </div>
                                <button
                                    class="btn w-full h-12 rounded-xl bg-[#0B6B45] hover:bg-[#095638] text-white font-semibold">
                                    Sign In
                                </button>
                                <div class="flex items-center gap-3">
                                    <div class="flex-1 h-px bg-gray-200"></div>
                                    <span class="text-xs text-gray-400">
                                        OR CONTINUE WITH
                                    </span>
                                    <div class="flex-1 h-px bg-gray-200"></div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <button
                                        class="social flex justify-center gap-[8px] items-center border rounded-xl h-12 bg-white">
                                        <img src="/assets/image-login/google.png" alt="google icon"
                                            class="w-[20px] h-[20px]">
                                        Google
                                    </button>
                                    <button
                                        class="social flex justify-center gap-[8px] items-center border rounded-xl h-12 bg-white">
                                        <img src="/assets/image-login/apple.png" alt="apple icon" class="w-[20px]">
                                        Apple
                                    </button>
                                </div>
                                <p class="text-center text-gray-600">
                                    Don't have an account?
                                    <a href="#" class="text-blue-600 font-medium">
                                        Create ID
                                    </a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- FOOTER -->
   <footer class="border-t border-[#BEC9BF4D]/30 md:border-hidden py-6">
    <div class="max-w-7xl mx-auto px-6 text-sm text-gray-500 md:flex md:justify-center">

        <!-- Mobile -->
        <div class="items-center gap-4 md:hidden">
            <div class="flex items-center justify-center gap-6">
                <a href="#" class="hover:text-[#0B6B45]">Privacy Policy</a>
                <a href="#" class="hover:text-[#0B6B45]">Help Center</a>

                <select class="bg-transparent border-none outline-none cursor-pointer">
                    <option>Arabic</option>
                    <option>English</option>
                </select>
            </div>

            <p class="text-center">
                © 2026 Kingdom of Morocco. Digital transformation for all citizens.
            </p>
        </div>

        <!-- Desktop -->
        <div class="hidden md:flex items-center justify-between">
            <p>
                © 2026 Kingdom of Morocco.
            </p>

            <div class="flex items-center gap-8">
                <a href="#" class="hover:text-[#0B6B45]">Privacy Policy</a>
                <a href="#" class="hover:text-[#0B6B45]">Help Center</a>

                <select class="bg-transparent border-none outline-none cursor-pointer">
                    <option>Arabic</option>
                    <option>English</option>
                </select>
            </div>
        </div>

    </div>
</footer>
</body>

</html>
