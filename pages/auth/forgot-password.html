<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="/pages/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M3ak Morocco | Forgot Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #F7FFF8;
        }

        .glass {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, .82);
        }

        .shadow-card {
            box-shadow:
                0 10px 35px rgba(0, 0, 0, .08);
        }

        .input {
            @apply w-full bg-[#F4F7F5] rounded-xl h-12 px-11 outline-none border border-transparent transition-all;
        }

        .input:focus {
            border-color: #0B6B45;
            box-shadow: 0 0 0 3px rgba(11, 107, 69, .15);
        }

        .btn {
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .bg-gradient {
            background:
                radial-gradient(circle at top, #DBF7E6, transparent 45%),
                radial-gradient(circle at bottom, #CEF8D7, transparent 45%),
                #F7FFF8;
        }

        .fade {
            animation: fade .7s;
        }

        @keyframes fade {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: none;
            }

        }

        /* ---------- Dark mode overrides (raw hex classes above) ---------- */
        .dark .bg-gradient {
            background:
                radial-gradient(circle at top, #10241C, transparent 45%),
                radial-gradient(circle at bottom, #0D1F17, transparent 45%),
                #0A0F0D;
        }

        .dark .glass {
            background: rgba(21, 28, 24, .82);
        }

        .dark .shadow-card {
            box-shadow: 0 10px 35px rgba(0, 0, 0, .4);
        }

        .dark .input {
            background-color: #0F1512;
            color: #E7ECE9;
        }

        .dark .input::placeholder {
            color: #7C8981;
        }

        .dark .input:focus {
            border-color: #2ED573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, .15);
        }
    </style>

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @theme {
            --color-night-900: #0A0F0D;
            --color-night-800: #0F1512;
            --color-night-700: #151C18;
            --color-night-600: #232C27;
            --color-mist-300: #7C8981;
            --color-mist-200: #B4BEB8;
            --color-mist-100: #E7ECE9;
            --color-accent-400: #2ED573;
            --color-accent-300: #5BE0A0;
        }

        .theme-toggle-btn {
            @apply w-[36px] h-[36px] rounded-full bg-white dark:bg-night-700 border border-gray-200 dark:border-night-600
                   flex items-center justify-center cursor-pointer shrink-0;
        }

        .theme-toggle-sun { @apply w-[16px] h-[16px] dark:hidden; }
        .theme-toggle-moon { @apply hidden dark:block w-[16px] h-[16px]; }
    </style>
    <script src="/pages/js/session.js"></script>
    <script src="/pages/js/forgot-password.js" defer></script>
</head>

<body class="bg-gradient relative min-h-screen">
    <!-- TOP -->
    <header>
        <div class="flex items-center justify-between px-6 pt-6">

            <a href="/pages/auth/login.html"
                class="flex items-center gap-2 text-[#0B6B45] dark:text-accent-400 font-medium">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />

                </svg>

                Back to Log in

            </a>

            <button type="button" class="theme-toggle-btn ml-auto" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
                <img src="/assets/image-login/icon-sun.png" alt="" class="theme-toggle-sun object-contain">
                <img src="/assets/image-login/icon-moon.png" alt="" class="theme-toggle-moon object-contain">
            </button>

        </div>
    </header>
    <!-- CONTENT -->
    <main class="mt-[9px] md:mt-[93px]">
        <section>
            <div class="flex flex-col items-center justify-center text-center">
                <div
                    class="w-[64px] py-[14px] bg-[#127147] items-center text-center flex justify-center rounded-[16px]">
                    <img src="/assets/image-login/logo.png" alt="logo-page">
                </div>

                <h1 class="mt-4 text-4xl font-bold text-[#0B6B45] dark:text-accent-400">
                    Forgot Password
                </h1>

                <p class="mt-2 max-w-sm text-gray-500 dark:text-mist-300">
                    Enter your National ID or email and we'll send you a link to reset your password.
                </p>
            </div>
        </section>
        <section class="flex-1 flex items-center justify-center mt-[30px] pb-[96px]">
            <div class="w-full max-w-7xl px-6">
                <div class="flex justify-center gap-16 items-center">
                    <!-- LEFT -->
                    <div class="fade items-center ">
                        <!-- CARD -->
                        <div class="glass shadow-card rounded-3xl w-full max-w-md p-8">
                            <form id="forgot-form" class="space-y-6">

                                <!-- IDENTIFIER -->
                                <div>
                                    <label class="text-sm font-medium text-gray-700 dark:text-mist-200">
                                        National ID or Email
                                    </label>

                                    <div class="relative mt-2">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2">
                                            <img src="/assets/image-login/user-icon.png" alt="user-icon">
                                        </div>

                                        <input id="identifier" type="text" placeholder="e.g. AB123456"
                                            class="w-full h-12 rounded-xl bg-[#F4F7F5] pl-12 pr-4 focus:ring-4 focus:ring-green-100 outline-none">
                                    </div>
                                </div>

                                <button type="submit"
                                    class="btn w-full h-12 rounded-xl bg-[#0B6B45] hover:bg-[#095638] text-white font-semibold">
                                    Send Reset Link
                                </button>

                                <p class="text-center text-gray-600 dark:text-mist-300">
                                    Remembered your password?
                                    <a href="/pages/auth/login.html" class="text-blue-600 dark:text-accent-400 font-medium">
                                        Log in
                                    </a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- FOOTER -->
    <footer class="border-t border-[#BEC9BF4D]/30 dark:border-night-600 md:border-hidden py-6">
        <div class="max-w-7xl mx-auto px-6 text-sm text-gray-500 dark:text-mist-300 text-center">
            <p>© 2026 Kingdom of Morocco. Digital transformation for all citizens.</p>
        </div>
    </footer>
</body>

</html>
