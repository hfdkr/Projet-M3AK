<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{border:0;width:420px;height:900px}</style>
<pre id="out" style="font:12px monospace;white-space:pre-wrap"></pre>
<iframe id="f" src="/pages/app/jobs.html"></iframe>
<script>
  localStorage.setItem("m3ak.session", JSON.stringify({name:"T",email:"t@t.com",initials:"T"}));
  localStorage.setItem("m3ak.theme","light");
  document.getElementById("f").addEventListener("load", () => setTimeout(() => {
    const d = document.getElementById("f").contentDocument;
    const de = d.documentElement;
    let lines = ["scrollW="+de.scrollWidth+" clientW="+de.clientWidth];
    const vw = de.clientWidth;
    d.querySelectorAll("*").forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.right > vw + 1) lines.push(Math.round(r.right)+"  "+el.tagName+"."+(el.className&&el.className.baseVal!==undefined?el.className.baseVal:el.className).toString().slice(0,60));
    });
    document.getElementById("out").textContent = lines.slice(0,40).join("\n");
    document.title = "done";
  }, 900));
</script>
